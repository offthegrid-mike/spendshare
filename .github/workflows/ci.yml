name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_FB_API_KEY: ci-dummy
          VITE_FB_AUTH_DOMAIN: ci-dummy
          VITE_FB_PROJECT_ID: ci-dummy
          VITE_FB_STORAGE_BUCKET: ci-dummy
          VITE_FB_SENDER_ID: ci-dummy
          VITE_FB_APP_ID: ci-dummy
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15
      - run: npm ci
      - run: npm run test:rules:ci
